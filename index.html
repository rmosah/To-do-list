<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المهام | To-Do List</title>
    <!-- خط تجوال من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ملف الـ CSS الخاص بنا -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- ترويسة التطبيق -->
        <header>
            <h1><i class="fa-solid fa-list-check"></i> قائمة مهامي</h1>
            <p>نظّم وقتك وأنجز أهدافك بكل سهولة</p>
        </header>

        <!-- نموذج إضافة مهمة جديدة -->
        <form id="todo-form">
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="اكتب مهمة جديدة هنا..." autocomplete="off">
                <button type="submit" id="add-btn">
                    <i class="fa-solid fa-plus"></i> إضافة
                </button>
            </div>
        </form>

        <!-- أزرار التصفية وإحصائيات المهام -->
        <div class="controls">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">الكل</button>
                <button class="filter-btn" data-filter="active">النشطة</button>
                <button class="filter-btn" data-filter="completed">المكتملة</button>
            </div>
            <div class="stats">
                المتبقي: <span id="remaining-count">0</span>
            </div>
        </div>

        <!--   قائمة عرض المهام     -->
        <ul id="todo-list"></ul>

        <!-- خيار مسح الكل -->
        <div class="footer-actions">
            <button id="clear-completed" class="btn-secondary">مسح المهام المكتملة</button>
        </div>
    </div>

    <!-- ملف الـ   JavaScript -->
    <script src="script.js"></script>
</body>
</html>
